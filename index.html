<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Maze: Gravity Tilt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #0E0F12; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; z-index: 10; position: relative; }
        
        #bg-parallax {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: radial-gradient(circle at 2px 2px, rgba(47, 208, 255, 0.07) 1px, transparent 0);
            background-size: 50px 50px; z-index: 1; pointer-events: none;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; padding: 40px;
            display: flex; justify-content: space-between; box-sizing: border-box;
            color: #2FD0FF; z-index: 20; pointer-events: none; text-transform: uppercase; letter-spacing: 4px;
        }
        
        #timer { font-size: 32px; font-weight: 900; color: #FF7A00; }
        #lvl-info { font-size: 18px; font-weight: 700; }

        #msg-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #FF7A00; font-size: 48px; font-weight: 900; text-align: center;
            display: none; z-index: 30; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="bg-parallax"></div>
    <div id="ui-overlay">
        <div id="lvl-info">Level <span id="lvl-val">01</span></div>
        <div id="timer">01:00</div>
    </div>
    <div id="msg-overlay">TIME UP<br><small style="font-size: 14px; color: #fff;">Press any key to retry</small></div>

<script>
/** * CONFIGURATION
 */
const COLORS = { ball: '#2FD0FF', goal: '#FF7A00', wall: '#252529', bg: '#0E0F12' };
const { Engine, Render, Runner, World, Bodies, Body, Composite, Events, Vector } = Matter;

let engine, render, runner, mazeGroup, ball, goal;
let keys = {};
let timeLeft = 60;
let level = 1;
let isGameOver = false;
let rotationAngle = 0;

function init() {
    // High-accuracy engine to prevent phasing
    engine = Engine.create({ 
        gravity: { x: 0, y: 1.5 }, // Strong downward gravity
        positionIterations: 20, 
        velocityIterations: 20 
    });

    render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: window.innerWidth, height: window.innerHeight,
            wireframes: false, background: 'transparent'
        }
    });

    runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if(isGameOver) resetLevel();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    startLevel();
    updateLoop();
    setInterval(tickTimer, 1000);
}

function tickTimer() {
    if (isGameOver) return;
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    
    if (timeLeft <= 0) {
        isGameOver = true;
        document.getElementById('msg-overlay').style.display = 'block';
    }
}

/** * MAZE GENERATION
 */
function startLevel() {
    isGameOver = false;
    timeLeft = 60;
    document.getElementById('msg-overlay').style.display = 'none';
    
    if (mazeGroup) World.clear(engine.world); // Total clear to prevent haywire physics
    mazeGroup = Composite.create();

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const cols = 11, rows = 11, s = 60; // Odd numbers for a clear center

    const grid = Array.from({ length: rows }, (_, r) => 
        Array.from({ length: cols }, (_, c) => ({ r, c, visited: false, walls: [true, true, true, true] }))
    );

    // Maze Algorithm
    const stack = [];
    let curr = grid[0][0];
    curr.visited = true;

    while (true) {
        const neighbors = [];
        const { r, c } = curr;
        if (r > 0 && !grid[r-1][c].visited) neighbors.push(grid[r-1][c]);
        if (c < cols-1 && !grid[r][c+1].visited) neighbors.push(grid[r][c+1]);
        if (r < rows-1 && !grid[r+1][c].visited) neighbors.push(grid[r+1][c]);
        if (c > 0 && !grid[r][c-1].visited) neighbors.push(grid[r][c-1]);

        if (neighbors.length) {
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            if (next.r < curr.r) { curr.walls[0] = false; next.walls[2] = false; }
            else if (next.c > curr.c) { curr.walls[1] = false; next.walls[3] = false; }
            else if (next.r > curr.r) { curr.walls[2] = false; next.walls[0] = false; }
            else if (next.c < curr.c) { curr.walls[3] = false; next.walls[1] = false; }
            stack.push(curr);
            curr = next;
            curr.visited = true;
        } else if (stack.length) {
            curr = stack.pop();
        } else break;
    }

    // Force open the center goal paths
    const mid = 5;
    grid[mid][mid].walls = [false, false, false, false];

    // Build Physics
    const ox = cx - (cols * s) / 2;
    const oy = cy - (rows * s) / 2;
    const t = 10;

    grid.forEach(row => row.forEach(cell => {
        const x = ox + cell.c * s, y = oy + cell.r * s;
        if (cell.walls[0]) addWall(x + s/2, y, s + t, t);
        if (cell.walls[1]) addWall(x + s, y + s/2, t, s + t);
        if (cell.walls[2]) addWall(x + s/2, y + s, s + t, t);
        if (cell.walls[3]) addWall(x, y + s/2, t, s + t);
    }));

    // Entities
    ball = Bodies.circle(ox + s/2, oy + s/2, 12, { 
        restitution: 0.2, friction: 0.1, frictionAir: 0.02, density: 0.01,
        render: { fillStyle: COLORS.ball }
    });
    
    goal = Bodies.circle(cx, cy, 18, { 
        isStatic: true, isSensor: true, 
        render: { fillStyle: '#000', strokeStyle: COLORS.goal, lineWidth: 4 } 
    });

    World.add(engine.world, [mazeGroup, ball, goal]);
}

function addWall(x, y, w, h) {
    const wBody = Bodies.rectangle(x, y, w, h, { isStatic: true, render: { fillStyle: COLORS.wall }, friction: 0.3 });
    Composite.add(mazeGroup, wBody);
}

/** * MAIN LOOP
 */
function updateLoop() {
    requestAnimationFrame(updateLoop);
    if (isGameOver) return;

    const ctx = render.context;
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    // 1. Maze Rotation
    rotationAngle += 0.003;
    Composite.allBodies(mazeGroup).forEach(b => {
        const rel = Vector.sub(b.position, {x: cx, y: cy});
        const dist = Vector.magnitude(rel);
        const angle = Math.atan2(rel.y, rel.x) + 0.003;
        Body.setPosition(b, { x: cx + Math.cos(angle)*dist, y: cy + Math.sin(angle)*dist });
        Body.setAngle(b, b.angle + 0.003);
    });

    // 2. Keyboard Movement (Screen Relative)
    const speed = 0.008;
    if (keys['ArrowUp'] || keys['KeyW']) Body.applyForce(ball, ball.position, { x: 0, y: -speed });
    if (keys['ArrowDown'] || keys['KeyS']) Body.applyForce(ball, ball.position, { x: 0, y: speed });
    if (keys['ArrowLeft'] || keys['KeyA']) Body.applyForce(ball, ball.position, { x: -speed, y: 0 });
    if (keys['ArrowRight'] || keys['KeyD']) Body.applyForce(ball, ball.position, { x: speed, y: 0 });

    // 3. Parallax Background
    document.getElementById('bg-parallax').style.transform = `translate(${ball.position.x * -0.04}px, ${ball.position.y * -0.04}px) rotate(${rotationAngle * 5}deg)`;

    // 4. Custom Drawing (Glows)
    ctx.globalCompositeOperation = 'lighter';
    const ballGlow = ctx.createRadialGradient(ball.position.x, ball.position.y, 0, ball.position.x, ball.position.y, 35);
    ballGlow.addColorStop(0, 'rgba(47, 208, 255, 0.6)');
    ballGlow.addColorStop(1, 'rgba(47, 208, 255, 0)');
    ctx.fillStyle = ballGlow;
    ctx.beginPath(); ctx.arc(ball.position.x, ball.position.y, 35, 0, Math.PI*2); ctx.fill();

    // Goal Effect
    const goalPulse = 20 + Math.sin(Date.now() * 0.005) * 5;
    const goalGlow = ctx.createRadialGradient(goal.position.x, goal.position.y, 0, goal.position.x, goal.position.y, 40);
    goalGlow.addColorStop(0, 'rgba(255, 122, 0, 0.4)');
    goalGlow.addColorStop(1, 'rgba(255, 122, 0, 0)');
    ctx.fillStyle = goalGlow;
    ctx.beginPath(); ctx.arc(goal.position.x, goal.position.y, 40, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // 5. Success Check
    if (Vector.magnitude(Vector.sub(ball.position, goal.position)) < 25) {
        level++;
        document.getElementById('lvl-val').innerText = level.toString().padStart(2, '0');
        startLevel();
    }
}

function resetLevel() {
    startLevel();
}

init();
</script>
</body>
</html>
