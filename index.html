<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Maze: Kinetic Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #0E0F12; overflow: hidden; font-family: 'Inter', sans-serif; touch-action: none; }
        canvas { display: block; z-index: 10; }
        
        #bg-grid {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(47, 208, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47, 208, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1; pointer-events: none;
        }

        #ui {
            position: absolute; top: 40px; left: 40px; color: #2FD0FF;
            z-index: 20; pointer-events: none; text-transform: uppercase; letter-spacing: 4px;
        }
        
        #lvl-val { font-size: 32px; display: block; font-weight: 900; }

        .controls {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; gap: 20px;
        }

        button {
            background: rgba(0, 0, 0, 0.7); border: 1px solid #2FD0FF;
            color: #2FD0FF; padding: 12px 24px; cursor: pointer; transition: 0.2s;
            font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px;
        }
        button:hover { background: #2FD0FF; color: #000; }
    </style>
</head>
<body>

    <div id="bg-grid"></div>
    <div id="ui">Level <span id="lvl-val">01</span></div>

    <div class="controls">
        <button onclick="toggleShape()">Toggle Shape</button>
        <button onclick="generateMaze()">Regenerate</button>
    </div>

<script>
const COLORS = { ball: '#2FD0FF', goal: '#FF7A00', wall: '#2A2A2E', bg: '#0E0F12' };
const { Engine, Render, Runner, World, Bodies, Body, Composite, Events, Vector } = Matter;

let engine, render, runner, mazeGroup, ball, goal;
let isDragging = false, mousePos = { x: 0, y: 0 };
let particles = [], collisionFlashes = [];
let shakeX = 0, shakeY = 0, shakeIntensity = 0;
let currentShape = 'circular';
const rotationSpeed = 0.004;

function init() {
    engine = Engine.create({ gravity: { x: 0, y: 0 } });
    render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: window.innerWidth, height: window.innerHeight,
            wireframes: false, background: 'transparent'
        }
    });

    runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    setupInput();
    generateMaze();

    // CUSTOM DRAWING HOOK (Runs after Matter.js renders bodies)
    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        
        // Apply Camera Shake
        if (shakeIntensity > 0.1) {
            shakeX = (Math.random() - 0.5) * shakeIntensity;
            shakeY = (Math.random() - 0.5) * shakeIntensity;
            ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);
            shakeIntensity *= 0.9;
        } else {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        ctx.globalCompositeOperation = 'lighter';

        // 1. Draw Collision Flashes
        collisionFlashes.forEach((f, i) => {
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(47, 208, 255, ${f.alpha})`; ctx.fill();
            f.r += 2; f.alpha -= 0.05;
            if (f.alpha <= 0) collisionFlashes.splice(i, 1);
        });

        // 2. Draw Win Particles
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, 122, 0, ${p.life})`; ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // 3. Ball Bloom
        const g = ctx.createRadialGradient(ball.position.x, ball.position.y, 0, ball.position.x, ball.position.y, 45);
        g.addColorStop(0, 'rgba(47, 208, 255, 0.6)');
        g.addColorStop(1, 'rgba(47, 208, 255, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ball.position.x, ball.position.y, 45, 0, Math.PI*2); ctx.fill();

        ctx.globalCompositeOperation = 'source-over';
    });

    // Handle Wall Collisions
    Events.on(engine, 'collisionStart', (e) => {
        e.pairs.forEach(p => {
            collisionFlashes.push({ x: ball.position.x, y: ball.position.y, r: 10, alpha: 0.8 });
            shakeIntensity = 3;
        });
    });
}

function generateMaze() {
    if (mazeGroup) World.remove(engine.world, mazeGroup);
    mazeGroup = Composite.create();
    const cx = window.innerWidth/2, cy = window.innerHeight/2;

    if (currentShape === 'circular') {
        const rings = 4, ringDist = 70;
        for (let i = 1; i <= rings; i++) {
            const r = i * ringDist;
            const segments = 8 + i * 2;
            for (let j = 0; j < segments; j++) {
                const angle = (j / segments) * Math.PI * 2;
                // Add some randomness to walls for paths
                if (Math.random() > 0.3) {
                    const spoke = Bodies.rectangle(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r, 10, 60, { 
                        isStatic: true, angle: angle, render: { fillStyle: COLORS.wall } 
                    });
                    Composite.add(mazeGroup, spoke);
                }
                if (Math.random() > 0.4) {
                    const arc = Bodies.rectangle(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r, 80, 10, { 
                        isStatic: true, angle: angle + Math.PI/2, render: { fillStyle: COLORS.wall } 
                    });
                    Composite.add(mazeGroup, arc);
                }
            }
        }
    } else {
        const s = 80;
        for (let i = -4; i <= 4; i++) {
            for (let j = -3; j <= 3; j++) {
                if (Math.random() > 0.6) {
                    const w = Bodies.rectangle(cx + i*s, cy + j*s, s, 10, { 
                        isStatic: true, angle: Math.random() > 0.5 ? 0 : Math.PI/2, render: { fillStyle: COLORS.wall } 
                    });
                    Composite.add(mazeGroup, w);
                }
            }
        }
    }

    if (ball) World.remove(engine.world, ball);
    ball = Bodies.circle(cx - 200, cy - 200, 15, { 
        restitution: 0.5, frictionAir: 0.05, render: { fillStyle: COLORS.ball } 
    });

    if (goal) World.remove(engine.world, goal);
    goal = Bodies.circle(cx, cy, 25, { 
        isStatic: true, isSensor: true, render: { fillStyle: '#000', strokeStyle: COLORS.goal, lineWidth: 4 } 
    });

    World.add(engine.world, [mazeGroup, ball, goal]);
}

function setupInput() {
    const getPos = (e) => e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
    
    window.addEventListener('mousedown', (e) => {
        const p = getPos(e);
        if (Vector.magnitude(Vector.sub(p, ball.position)) < 50) isDragging = true;
    });
    window.addEventListener('touchstart', (e) => {
        const p = getPos(e);
        if (Vector.magnitude(Vector.sub(p, ball.position)) < 60) isDragging = true;
    });
    window.addEventListener('mousemove', (e) => mousePos = getPos(e));
    window.addEventListener('touchmove', (e) => mousePos = getPos(e));
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);

    Events.on(engine, 'beforeUpdate', () => {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;

        // Maze Rotation
        Composite.allBodies(mazeGroup).forEach(b => {
            const relPos = Vector.sub(b.position, { x: cx, y: cy });
            const angle = Math.atan2(relPos.y, relPos.x) + rotationSpeed;
            const dist = Vector.magnitude(relPos);
            Body.setPosition(b, { x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist });
            Body.setAngle(b, b.angle + rotationSpeed);
        });

        if (isDragging) {
            Body.setVelocity(ball, Vector.mult(Vector.sub(mousePos, ball.position), 0.2));
        }

        // Parallax
        document.getElementById('bg-grid').style.transform = `translate(${ball.position.x * -0.05}px, ${ball.position.y * -0.05}px)`;

        // Goal Check
        if (Vector.magnitude(Vector.sub(ball.position, goal.position)) < 30) {
            shakeIntensity = 15;
            for(let i=0; i<30; i++) particles.push({ x: goal.position.x, y: goal.position.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, size: Math.random()*5 });
            Body.setPosition(ball, { x: -1000, y: -1000 });
            setTimeout(() => {
                const ui = document.getElementById('lvl-val');
                ui.innerText = (parseInt(ui.innerText) + 1).toString().padStart(2, '0');
                generateMaze();
            }, 800);
        }
    });
}

function toggleShape() {
    currentShape = currentShape === 'circular' ? 'square' : 'circular';
    generateMaze();
}

init();
</script>
</body>
</html>
