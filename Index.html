
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Minimalist Maze: Glow & Physics (Web)</title>
  <style>
    :root{
      --bg:#0E0F12; --wall:#1A1A1A; --ball:#2FD0FF; --spark:#FF7A00; --text:#D7DBE0;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    #hud{
      position:fixed;top:10px;left:10px;display:flex;gap:12px;align-items:center;z-index:10;
      background:#101217cc;border:1px solid #1f232b;border-radius:8px;padding:8px 10px;backdrop-filter:blur(4px);
    }
    #hud .btn{cursor:pointer;border:1px solid #2b313b;background:#12161b;color:var(--text);padding:6px 10px;border-radius:6px}
    #hud .btn:hover{background:#171c22}
    #hud label{display:flex;align-items:center;gap:6px;cursor:pointer}
    #levels{
      position:fixed;top:10px;right:10px;z-index:10;background:#101217cc;border:1px solid #1f232b;border-radius:8px;padding:8px 10px;
      display:flex;gap:8px;align-items:center;backdrop-filter:blur(4px);
    }
    #levels .lvl{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid #2b313b;background:#12161b;color:#9aa3af;cursor:pointer}
    #levels .lvl.active{color:#fff;border-color:#4b5563;background:#18202a}
    #gamewrap{position:relative;width:100vw;height:100vh;overflow:hidden}
    canvas{position:absolute;inset:0}
    #overlayMsg{
      position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;pointer-events:none;opacity:0;transition:opacity .25s;
    }
    #overlayMsg.show{opacity:1}
  </style>
</head>
<body>
  <div id="gamewrap">
    <canvas id="render"></canvas>
    <canvas id="fx"></canvas>
    <div id="overlayMsg"></div>
  </div>

  <div id="hud">
    <div id="timer">⏱ 180</div>
    <div id="levelLabel">Level 1/5 ▢</div>
    <button class="btn" id="restart">Restart</button>
    <label><input type="checkbox" id="glowToggle" checked/> Glow</label>
    <label><input type="checkbox" id="audioToggle"/> Audio</label>
  </div>

  <div id="levels"></div>

  <!-- Matter.js physics (CDN) — FIXED SCRIPT TAG -->
  https://unpkg.com/matter-js@0.19.0/build/matter.min.js</script>

  <script>
  (() => {
    const {Engine, Render, Runner, Bodies, Composite, Events, Body, Vector, Mouse, MouseConstraint} = Matter;

    // ---- Config ----
    const SESSION_LEVELS = 5;
    const MAZE_TIME = 180; // seconds per level
    const WORLD_W = 880, WORLD_H = 640;            // logical world size
    const WALL_THICK = 18;                          // collider thickness
    const BALL_R = 14;                              // ball radius
    const MAX_SPEED = 9.0;                          // drag-assist cap
